version: '3.8'

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:15-alpine
    container_name: aervo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aervo
      POSTGRES_USER: aervo
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aervo_db_password_change_this}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - aervo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aervo"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Redis Cache & Queue
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: aervo-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - aervo-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # MinIO Object Storage (S3 Compatible)
  # ============================================
  minio:
    image: minio/minio:latest
    container_name: aervo-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-aervo_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-aervo_minio_secret_change_this}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - aervo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ============================================
  # Backend API (Node.js + Express)
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aervo-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://aervo:${DB_PASSWORD:-aervo_db_password_change_this}@postgres:5432/aervo
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: false
      MINIO_BUCKET: emlakdrone
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-aervo_admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-emlakdrone_minio_secret_2025_secure}
    volumes:
      - ./backend/uploads:/app/uploads
      - ./storage:/app/storage
    ports:
      - "3001:3001"
    networks:
      - aervo-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npm run start"

  # ============================================
  # Frontend (Next.js)
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${BACKEND_URL:-http://localhost:3001}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
    container_name: aervo-frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    networks:
      - aervo-network
    depends_on:
      - backend

  # ============================================
  # Video Processor Worker
  # ============================================
  video-processor:
    build:
      context: ./video-processor
      dockerfile: Dockerfile
    container_name: aervo-video-processor
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: false
      MINIO_BUCKET: emlakdrone
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-aervo_admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-emlakdrone_minio_secret_2025_secure}
    volumes:
      - ./storage:/app/storage
      - ./video-processor/assets:/app/assets
    networks:
      - aervo-network
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  # ============================================
  # Nginx Reverse Proxy
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: aervo-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - aervo-network
    depends_on:
      - frontend
      - backend

  # ============================================
  # Certbot for SSL (Let's Encrypt)
  # ============================================
  certbot:
    image: certbot/certbot
    container_name: aervo-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  aervo-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
